version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: chat-bridge-backend:latest
    container_name: chat-bridge-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
